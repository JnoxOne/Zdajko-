name: Import oficjalnej bazy pytań

on:
  workflow_dispatch:
  push:
    branches: [baza-pytan]
    paths: [.github/workflows/import-bank.yml, scripts/import_bank.py]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Zwolnij miejsce na dysku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Pobierz bazę z gov.pl
        run: |
          mkdir -p /mnt/bank 2>/dev/null || sudo mkdir -p /mnt/bank; sudo chown "$USER" /mnt/bank
          cd /mnt/bank
          curl -sSL --retry 5 -o katalog.xlsx "https://www.gov.pl/attachment/a5c6c329-28a5-4274-a1a8-e2813f0a51bd"
          curl -sSL --retry 5 -o media2.zip "https://www.gov.pl/attachment/71d22a89-4c2d-4b08-9f47-99286bb0c964"
          curl -sSL --retry 5 -C - -o media1.zip "https://www.gov.pl/pliki/mi/multimedia_do_pytan.zip" || curl -sSL --retry 5 -C - -o media1.zip "https://www.gov.pl/pliki/mi/multimedia_do_pytan.zip"
          ls -la
      - name: Rozpakuj
        run: |
          cd /mnt/bank
          mkdir -p media
          unzip -q -o media2.zip -d media && rm media2.zip
          unzip -q -o media1.zip -d media && rm media1.zip
          du -sh media; find media -type f | sed 's/.*\.//' | tr A-Z a-z | sort | uniq -c
          df -h / /mnt
      - name: Przetwórz
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q openpyxl
          rm -rf public/bank
          python3 scripts/import_bank.py /mnt/bank/katalog.xlsx /mnt/bank/media public/bank
          du -sh public/bank
      - name: Zapisz do repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bank
          git commit -q -m "Oficjalna baza pytań z gov.pl (import automatyczny)" || echo "bez zmian"
          # The branch may have moved while the import ran.
          git pull -q --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
