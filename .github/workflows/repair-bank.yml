name: Naprawa grafik w bazie pytań

on:
  workflow_dispatch:
  push:
    branches: [baza-pytan]
    paths: [.github/workflows/repair-bank.yml, scripts/repair_bank.py]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Napraw brakujące grafiki
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q openpyxl remotezip
          curl -sSL --retry 5 -o /tmp/katalog.xlsx "https://www.gov.pl/attachment/a5c6c329-28a5-4274-a1a8-e2813f0a51bd"
          cd scripts && python3 repair_bank.py /tmp/katalog.xlsx ../public/bank \
            "https://www.gov.pl/attachment/71d22a89-4c2d-4b08-9f47-99286bb0c964" \
            "https://www.gov.pl/pliki/mi/multimedia_do_pytan.zip"
      - name: Zapisz do repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bank
          git commit -q -m "Uzupełnione grafiki w bazie pytań (naprawa automatyczna)" || echo "bez zmian"
          git pull -q --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
