name: Rozpoznanie arkusza pytań

on:
  push:
    branches: [baza-pytan]
    paths: [.github/workflows/explore-sheet.yml]

jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL --max-time 600 -o katalog.xlsx "https://www.gov.pl/attachment/a5c6c329-28a5-4274-a1a8-e2813f0a51bd"
          ls -la katalog.xlsx
          pip install -q openpyxl
          python3 - <<'PY'
          import openpyxl, collections, json
          wb = openpyxl.load_workbook("katalog.xlsx", read_only=True)
          for ws in wb.worksheets:
              rows = list(ws.iter_rows(values_only=True))
              print("SHEET", ws.title, len(rows))
              for r in rows[:4]: print(json.dumps(r, ensure_ascii=False, default=str))
              hdr = rows[0]
              for i, h in enumerate(hdr):
                  vals = collections.Counter(str(r[i])[:40] for r in rows[1:] if i < len(r))
                  print("COL", i, h, "distinct", len(vals), vals.most_common(8))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: katalog
          path: katalog.xlsx
      - name: Rozmiar paczek multimediów
        run: |
          for u in https://www.gov.pl/pliki/mi/multimedia_do_pytan.zip https://www.gov.pl/attachment/71d22a89-4c2d-4b08-9f47-99286bb0c964; do curl -sSIL --max-time 60 "$u" | grep -i "content-length\|^HTTP"; done
